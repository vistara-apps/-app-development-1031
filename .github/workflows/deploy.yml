name: Build and Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set Docker tag
      id: vars
      run: |
        echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
        echo "IMAGE_TAG=registry.vistara.dev/1a9e7f6e-3f9c-4d47-a61c-fe776b5aa8aa:${{ github.sha }}" >> $GITHUB_ENV
        echo $GITHUB_ENV $TAG $IMAGE_TAG

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          LINEAR_API_KEY=${{ secrets.LINEAR_API_KEY }}

    - name: Update Linear Issue Status
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        # Update Linear issue status using the API key
        # This is a placeholder for the actual Linear API call
        echo "Updating Linear issue status for project ID: e276ed3f-5540-43e3-b716-fa87a57387ed"
        curl -X POST \
          -H "Content-Type: application/json" \
          -H "Authorization: ${{ secrets.LINEAR_API_KEY }}" \
          -d '{"query":"mutation { issueUpdate(id: \"e276ed3f-5540-43e3-b716-fa87a57387ed\", input: { stateId: \"completed\" }) { success } }"}' \
          https://api.linear.app/graphql
