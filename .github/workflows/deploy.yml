name: Build and Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    # Docker login step is disabled as we're not pushing to a registry
    # - name: Login to Docker Registry
    #   uses: docker/login-action@v3
    #   with:
    #     registry: registry.vistara.dev
    #     username: ${{ secrets.DOCKER_USERNAME }}
    #     password: ${{ secrets.DOCKER_PASSWORD }}
    #   continue-on-error: true

    - name: Set Docker tag
      id: vars
      run: |
        echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
        echo "IMAGE_TAG=registry.vistara.dev/1a9e7f6e-3f9c-4d47-a61c-fe776b5aa8aa:${{ github.sha }}" >> $GITHUB_ENV
        echo $GITHUB_ENV $TAG $IMAGE_TAG

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true
