name: Build and Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set Docker tag
      id: vars
      run: |
        echo "TAG=${{ github.sha }}" >> $GITHUB_ENV
        echo "IMAGE_TAG=registry.vistara.dev/1a9e7f6e-3f9c-4d47-a61c-fe776b5aa8aa:${{ github.sha }}" >> $GITHUB_ENV
        echo $GITHUB_ENV $TAG $IMAGE_TAG

    - name: Build Docker image (without push for PR)
      uses: docker/build-push-action@v5
      if: github.event_name == 'pull_request'
      with:
        context: .
        push: false
        tags: ${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Docker image (main branch only)
      uses: docker/build-push-action@v5
      if: github.ref == 'refs/heads/main'
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
